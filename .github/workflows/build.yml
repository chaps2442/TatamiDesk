name: Build TatamiDesk.exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: python -m PyInstaller --onefile --windowed --name TatamiDesk --icon assets/tatamidesk.ico tatamidesk.pyw

      - uses: actions/upload-artifact@v4
        with:
          name: TatamiDesk
          path: dist/TatamiDesk.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TatamiDesk.exe
          body_path: CHANGELOG.md
